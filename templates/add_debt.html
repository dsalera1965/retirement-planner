<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Debt - Retirement Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="setup-shell">
      <div class="setup-card">
        <div class="form-header">
          <p class="eyebrow">Debt Management</p>
          <h1>Add New Debt</h1>
        </div>

        <form method="post">
          <div class="field-grid">
            <label>
              <span>Debt Name</span>
              <input name="name" type="text" placeholder="e.g., Car Loan, Mortgage" required />
            </label>
            <label>
              <span>Debt Type</span>
              <select name="debt_type" required>
                <option value="">Select a type</option>
                <option value="Mortgage">Mortgage</option>
                <option value="Car">Car Loan</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Student Loan">Student Loan</option>
                <option value="Personal">Personal Loan</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <label>
              <span>Current Balance</span>
              <input name="balance" type="number" step="0.01" placeholder="0.00" required />
            </label>
            <label>
              <span>Monthly Payment</span>
              <input name="monthly_payment" type="number" step="0.01" placeholder="0.00" required />
            </label>
            <label>
              <span>Annual Interest Rate (%)</span>
              <input name="interest_rate" type="number" step="0.01" placeholder="0.00" required />
            </label>
            <label>
              <span>Months Remaining</span>
              <input name="remaining_months" type="number" min="1" placeholder="0" required />
            </label>
          </div>

          <div class="form-actions">
            <a class="secondary-btn" href="{{ url_for('debts') }}">Cancel</a>
            <button class="primary-btn" type="submit">Add Debt</button>
          </div>
        </form>
      </div>
    </div>

    <style>
      select {
        width: 100%;
        padding: 0.5rem;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-family: inherit;
      }
    </style>
  </body>
</html>
